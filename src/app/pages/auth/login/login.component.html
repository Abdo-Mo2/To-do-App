<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 transition-colors duration-300 px-4 py-8">
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 sm:p-8">
    <h1 class="text-2xl sm:text-3xl font-bold mb-2 text-gray-900 dark:text-gray-100 text-center">Welcome back</h1>
    <p class="text-sm sm:text-base text-gray-600 dark:text-gray-400 mb-6 text-center">Log in to keep your tasks in sync across devices.</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:border-blue-500 focus:outline-none"
          placeholder="you@example.com"
        />
        <p class="text-sm text-red-500 mt-1" *ngIf="form.controls.email.touched && form.controls.email.invalid">
          Please enter a valid email address.
        </p>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Password</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-3 rounded-lg border-2 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 focus:border-blue-500 focus:outline-none"
          placeholder="Enter your password"
        />
        <p class="text-sm text-red-500 mt-1" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Password must be at least 6 characters.
        </p>
      </div>

      <div *ngIf="error" class="text-sm text-red-500 bg-red-100 dark:bg-red-900/40 border border-red-200 dark:border-red-800 rounded-lg p-3">
        {{ error }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full py-3 bg-blue-500 hover:bg-blue-600 disabled:bg-blue-300 text-white font-semibold rounded-lg transition-colors duration-200"
      >
        <span *ngIf="!loading">Log In</span>
        <span *ngIf="loading" class="flex items-center justify-center gap-2">
          <i class="fas fa-spinner fa-spin"></i>
          Logging in...
        </span>
      </button>
    </form>

    <p class="mt-6 text-center text-gray-600 dark:text-gray-400">
      Don't have an account?
      <a routerLink="/signup" class="text-blue-500 hover:text-blue-600 font-medium">Sign up</a>
    </p>
  </div>
</div>
