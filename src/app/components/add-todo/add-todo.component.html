<div class="mb-4 sm:mb-6">
  <div class="flex gap-2">
    <input
      type="text"
      [(ngModel)]="taskText"
      (keyup.enter)="submit()"
      placeholder="Add a new task..."
      class="flex-1 px-3 sm:px-4 py-2 sm:py-3 text-sm sm:text-base rounded-lg border-2 border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 placeholder-gray-500 dark:placeholder-gray-400 focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 transition-colors duration-200"
    />
    <button
      (click)="submit()"
      class="px-3 sm:px-6 py-2 sm:py-3 bg-blue-500 hover:bg-blue-600 text-white text-sm sm:text-base rounded-lg font-semibold transition-colors duration-200 shadow-md hover:shadow-lg transform hover:scale-105"
    >
      <i class="fas fa-plus sm:mr-2"></i>
      <span class="hidden sm:inline">Add</span>
    </button>
  </div>
</div>
